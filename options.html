<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Extension Options</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input { width: 100%; padding: 8px; margin: 5px 0 15px; }
    button { padding: 10px 20px; }
    #status { color: green; }
  </style>
</head>
<body>
  <h2>Telegram Bot Settings</h2>
  <label>Bot Token:</label>
  <input type="text" id="botToken" placeholder="123456:ABC-DEF1234gh..." />
  <label>Chat ID (your numeric ID):</label>
  <input type="text" id="chatId" placeholder="123456789" />
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
